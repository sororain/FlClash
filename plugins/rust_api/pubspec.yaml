name: rust_api
description: "Flutter Rust Bridge FFI package built through Dart build hooks (Native Assets)."
version: 0.0.1
homepage:
publish_to: none

environment:
  sdk: '>=3.9.2 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  code_assets: ^1.2.1
  flutter:
    sdk: flutter
  # 保持 2.12.0 与已生成的 frb_generated.* 一致：hook 包装器
  # (flutter_rust_bridge_hooks) 不校验 crate 版本，故无需重新 codegen。
  # 将来对齐上游 rquickjs/hotkey 源码时再一起升到 2.13.0 并跑
  # `flutter_rust_bridge_codegen generate`。
  flutter_rust_bridge: 2.12.0
  flutter_rust_bridge_hooks: 2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 本仓库统一 ^6（上游 rust_api 用 ^5，与本机 pub 缓存不一致会解析失败）
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

# 本包不再是插件：没有平台目录、也不再声明 plugin.platforms，
# Rust 代码由 hook/build.dart 通过 Native Assets 在每次构建时编译并打包进应用。
